<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="50%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Shine effect -->
  <ellipse cx="180" cy="150" rx="160" ry="120" fill="url(#shine)"/>
  
  <!-- L shape - infinity loop style -->
  <path d="M140 380 L140 180 C140 140 170 110 210 110 L280 110 C320 110 350 140 350 180 L350 250 C350 290 320 320 280 320 L210 320 C180 320 160 340 160 370 L160 400" 
        stroke="white" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Infinity loop bottom right -->
  <path d="M280 320 C350 320 400 370 400 430 C400 490 350 530 280 530 C210 530 160 490 160 430 C160 380 200 340 250 340" 
        stroke="white" stroke-width="50" stroke-linecap="round" fill="none"/>
  
  <!-- Stars -->
  <circle cx="380" cy="150" r="25" fill="white" opacity="0.9"/>
  <circle cx="420" cy="220" r="18" fill="white" opacity="0.7"/>
  <circle cx="120" cy="450" r="20" fill="white" opacity="0.8"/>
  
  <!-- QR dots suggestion -->
  <rect x="320" y="380" width="30" height="30" rx="4" fill="white" opacity="0.8"/>
  <rect x="360" y="380" width="30" height="30" rx="4" fill="white" opacity="0.8"/>
  <rect x="320" y="420" width="30" height="30" rx="4" fill="white" opacity="0.8"/>
  <rect x="360" y="420" width="30" height="30" rx="4" fill="white" opacity="0.6"/>
</svg>
